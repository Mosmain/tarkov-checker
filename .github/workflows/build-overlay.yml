name: Build overlay

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/install-js

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Rust fmt check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - run: pnpm build:overlay

      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --release -- -D warnings

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --release --no-fail-fast

      - uses: actions/upload-artifact@v7
        with:
          name: tarkov-checker-desktop
          path: apps/desktop/src-tauri/target/release/tarkov-checker-desktop.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/desktop/src-tauri/target/release/tarkov-checker-desktop.exe
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
