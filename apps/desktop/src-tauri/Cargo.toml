[package]
name = "raidmate"
version = "0.2.0"
description = "Desktop overlay and helper for RaidMate"
authors = ["raidmate"]
edition = "2021"
rust-version = "1.77"
default-run = "raidmate"

[lib]
name = "raidmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "raidmate"
path = "src/main.rs"

[[bin]]
name = "raidmate-headless"
path = "src/bin/headless.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# Standalone global-hotkey registration for the headless backend (run_headless),
# where there is no Tauri/plugin event loop. In the windowed app the plugin
# above owns registration; the two never coexist in one process (the plugin
# installs a process-global GlobalHotKeyEvent handler — see the hotkey rework
# notes). Same accelerator-string parser the client emits.
global-hotkey = "0.7"
# Win32 message pump for the headless hotkey thread: the global-hotkey crate
# needs a GetMessage/PeekMessage loop on the thread that owns its hidden
# message window, otherwise WM_HOTKEY is never delivered. Version pinned to
# match the one global-hotkey already pulls (no extra lockfile entry).
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
tauri-plugin-window-state = "2"
# System-clipboard access for the tray "Copy LAN URL" item. Used from Rust
# (ClipboardExt in commands::copy_lan_url), so the write happens natively and
# needs no DOM user-gesture — unlike navigator.clipboard, which a tray-menu
# click can't satisfy.
tauri-plugin-clipboard-manager = "2"
# Native Windows toast for the one-time "still running in the tray" hint on the
# first close-to-tray. We use this directly (not tauri-plugin-notification)
# because the plugin only stamps the toast's AppUserModelID for installed apps
# — our portable .exe runs from target/release, so the plugin leaves it as
# PowerShell's identity. We register our own AUMID + icon (src/notify.rs) and
# emit with it. Already in the tree transitively; pinning it as a direct dep.
tauri-winrt-notification = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server runtime: filesystem watchers, config storage, registry probes.
anyhow = "1"
thiserror = "1"
notify = "6"
notify-debouncer-full = "0.3"
tokio = { version = "1", features = ["sync", "rt", "time", "fs", "macros", "net"] }
winreg = "0.52"
once_cell = "1"
regex = "1"
# HTTP server. Listens on 0.0.0.0:47474 — same-Wi-Fi trust model, no
# bearer-token auth (browser-context callers are gated by the
# CorsLayer Origin allowlist; native curl-equivalents on the LAN are
# unfiltered by design).
axum = "0.7"
# Standard CORS middleware. Handles OPTIONS preflight, Access-Control-Allow-*
# headers, and the Chrome "Private Network Access" header that public-origin
# pages need when contacting localhost.
tower-http = { version = "0.6", features = ["cors"] }
# Adapter that converts a tokio broadcast Receiver into a Stream — needed
# by axum's Sse response. The `sync` feature brings BroadcastStream.
tokio-stream = { version = "0.1", features = ["sync"] }
# Stream/StreamExt traits for mapping the BroadcastStream into the
# Result<Sse::Event, _> shape axum's Sse wants. Tiny crate, already
# transitively pulled by axum/tokio-stream — exposing it directly.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Embed apps/client/dist/ into the .exe so the helper can serve the SPA
# same-origin to any browser that hits it (LAN-phone scenario, hosted-
# page-served-from-helper). Debug builds read from disk at request time
# (HMR-like); release builds bake the bytes in.
#
# `compression` feature is NOT enabled — it pulls in zstd-sys which
# crashes rustc with STATUS_ACCESS_VIOLATION on this Windows host
# (see CLAUDE.md "Windows build quirks"). Raw embed adds ~3 MB to the
# .exe (uncompressed dist size). Re-evaluate once D2-E lands and the
# binary is back in CI — CI is reliable enough to take the hit.
rust-embed = "8"
# Maps file extensions to MIME types for the SPA fallback handler. The
# embed crate gives us bytes; this gives us the right Content-Type so
# the browser parses index.html as HTML and .svg as image/svg+xml.
mime_guess = "2"
# QR-code generation for the phone pairing flow. The pairing_qr command
# renders an SVG QR encoding the LAN URL; the webview displays it
# inline. SVG scales without rasterisation and the encoded payload is
# small (~256 bytes).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Sends parsed screenshots to the OS recycle bin (recoverable) when the
# opt-in "delete after parse" setting is on — see server/screenshots.rs.
# Recycle bin (not permanent unlink) so an accidental enable is undoable.
trash = "5"
# Detects the host's primary LAN IP (first non-loopback IPv4). Used by
# pairing_qr to build the URL the QR encodes. Multi-NIC hosts can pick
# the wrong interface (Hyper-V switch, WSL2 vNIC) — the pairing modal
# surfaces the picked value so the user notices.
local-ip-address = "0.6"
# HTTP client for the portable self-updater (GitHub releases/latest +
# asset download). native-tls = schannel on Windows — avoids rustls/ring,
# whose build scripts are flaky on this host (see "Windows build quirks").
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

[dev-dependencies]
# `oneshot` extension on Router for unit-testing handlers in-process —
# pulls no extra runtime cost into the release binary.
tower = { version = "0.5", features = ["util"] }

[profile.release]
panic = "abort"
# LTO + codegen-units=1 (the tight-binary settings) put enough memory
# pressure on rustc/LLVM that they crash with random STATUS_ACCESS_VIOLATION
# during compilation on this host. Relaxed values trade ~2 MB binary
# size for a build that actually completes in one pass.
codegen-units = 16
lto = false
opt-level = "s"
strip = true
