[package]
name = "tarkov-checker-desktop"
version = "0.0.0"
description = "Desktop wrapper for tarkov-checker"
authors = ["tarkov-checker"]
edition = "2021"
rust-version = "1.77"
default-run = "tarkov-checker-desktop"

[lib]
name = "tarkov_checker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tarkov-checker-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
