[package]
name = "tarkov-checker-desktop"
version = "0.0.0"
description = "Desktop wrapper for tarkov-checker"
authors = ["tarkov-checker"]
edition = "2021"
rust-version = "1.77"
default-run = "tarkov-checker-desktop"

[lib]
name = "tarkov_checker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tarkov-checker-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server runtime ported from apps/server.
anyhow = "1"
thiserror = "1"
notify = "6"
notify-debouncer-full = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["sync", "rt", "time", "fs", "macros"] }
winreg = "0.52"
once_cell = "1"
regex = "1"

[profile.release]
panic = "abort"
# LTO + codegen-units=1 (the tight-binary settings) put enough memory
# pressure on rustc/LLVM that they crash with random STATUS_ACCESS_VIOLATION
# during compilation on this host. Relaxed values trade ~2 MB binary
# size for a build that actually completes in one pass.
codegen-units = 16
lto = false
opt-level = "s"
strip = true
