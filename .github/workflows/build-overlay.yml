name: Build overlay

# Manual: GitHub UI → Actions → "Build overlay" → Run workflow.
# Tag push (v*): also builds and attaches the .exe to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # apps/client/public/maps is a git submodule (the SVG maps).
          # Vite bundles them as static assets — without the submodule
          # the build "succeeds" but the overlay ships a broken map.
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # MSVC + Rust stable are preinstalled on windows-latest; this just
      # nails the channel and exposes `rustup` to subsequent steps.
      - uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo/registry + the project's target/ keyed on Cargo.lock.
      # First run is slow (full compile, ~8-12 min); subsequent runs reuse
      # everything not touched by the lockfile change (~3-5 min).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm overlay:build

      - uses: actions/upload-artifact@v4
        with:
          name: tarkov-checker-desktop
          path: apps/desktop/src-tauri/target/release/tarkov-checker-desktop.exe
          retention-days: 30
          if-no-files-found: error

      # On a v* tag push, also drop the .exe onto a draft GitHub Release.
      # Manual workflow_dispatch runs skip this step (no tag, no release).
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/desktop/src-tauri/target/release/tarkov-checker-desktop.exe
