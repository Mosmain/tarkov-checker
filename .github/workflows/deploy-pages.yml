name: Deploy frontend to GitHub Pages

# What this does:
#   1. On push to `master` (or a manual dispatch), builds the Vue SPA.
#   2. Uploads the static `apps/client/dist/` as a Pages artifact.
#   3. Tells GitHub Pages to publish that artifact.
#
# Repository setup (one-time): Settings → Pages → "Build and deployment"
# → Source = "GitHub Actions" (not "Deploy from a branch"). Without this
# the deploy step refuses to upload.
#
# The published URL is `https://<user>.github.io/<repo>/` for project
# pages — by default `https://mosmain.github.io/raidmate/`.
# Update `GITHUB_PAGES_BASE` in `apps/client/vite.config.ts` and
# `ALLOWED_ORIGINS` in `apps/desktop/src-tauri/src/http_server.rs` if
# the URL changes (rename, custom domain).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time — racing deploys would corrupt the
# served artifact. `cancel-in-progress: false` lets an in-flight deploy
# finish so the live site never goes empty mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # apps/client/public/maps is a git submodule (SVG maps).
          # Without this checkout silently ships an empty maps dir and
          # the deployed site renders the basemap but no per-Tarkov-map
          # SVG overlay.
          submodules: recursive

      - uses: ./.github/actions/install-js

      # GITHUB_PAGES=true flips Vite's `base` to `/raidmate/` and
      # turns on the 404.html fallback plugin (SPA-history workaround
      # for Pages — see vite.config.ts).
      - name: Build SPA
        env:
          GITHUB_PAGES: 'true'
        run: |
          pnpm --filter @raidmate/shared build
          pnpm --filter @raidmate/client build

      # Pages artifact is just a tarball of the dist/ folder; the deploy
      # job below unpacks it into the published site.
      #
      # `enablement: true` flips Pages on the first time this runs — saves
      # a manual trip through Settings → Pages. Requires `pages: write`
      # permission (granted in the top-level `permissions:` block above).
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
